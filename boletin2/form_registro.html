<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de desarrolladores</title>
</head>
<body>
<form action="https://lm.ciclo.iesnervion.es/registro.php" method="POST">
    <label for="codigo">Código de Alumno:</label>
    <input type="text" id="codigo" name="codigo" pattern="[A-Z]{3}[0-9]{3}" required>
    <br><br>
    <label for="correo">Correo corporativo:</label>
    <input type="email" id="correo" name="correo" required>
    <br><br>
    <label for="edad">Edad:</label>
    <input type="number" id="edad" name="edad" min="16" max="65">
    <br><br>
    <label for="telefono">Teléfono de contacto:</label>
    <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">
    <br><br>
    <label for="web">Sitio web / Portfolio:</label>
    <input type="url" id="web" name="web">
    <br><br>
    <label for="ide">IDE Preferido:</label>
    <input type="text" id="ide" name="ide" list="ides">
    <datalist id="ides">
        <option value="IntelliJ IDEA">
        <option value="Visual Studio Code">
        <option value="Eclipse">
        <option value="Android Studio">
    </datalist>
    <br><br>
    <input type="checkbox" id="privacidad" name="privacidad" value="aceptada" required>
    <label for="privacidad">Aceptación de la Política de Privacidad</label>
    <br><br>
    <button type="submit">Registrar</button>
</form>
</body>
</html>
