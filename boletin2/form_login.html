<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de acceso</title>
</head>
<body>
<form action="https://lm.ciclo.iesnervion.es/login.php" method="POST">
    <label for="usuario">Nombre de usuario o Email:</label>
    <input type="text" id="usuario" name="usuario" placeholder="usuario@dominio.com" required>
    <br>
    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" required>
    <br>
    <input type="checkbox" id="recordar" name="recordar" value="si">
    <label for="recordar">Recordar sesión</label>
    <br>
    <button type="submit">Iniciar Sesión</button>
</form>
</body>
</html>
