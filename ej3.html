<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabla</title>
</head>
<body>
<table border="1">
    <tr>
        <th>Lunes</th>
        <th>Martes</th>
        <th>Miércoles</th>
        <th>Jueves</th>
        <th>Viernes</th>
    </tr>
    <tr>
        <td>Mates</td>
        <td colspan="3" rowspan="2"><p>Dibujo</p></td>
        <td rowspan="3"><p>Historia</p></td>
    </tr>
    <tr>
        <td rowspan="3"><p>Física</p></td>
    </tr>
    <tr>
        <td>Lengua</td>
        <td>Inglés</td>
        <td>Francés</td>
    </tr>
    <tr>
        <td>EF</td>
        <td>Fútbol</td>
        <td>Tenis</td>
        <td>Mates</td>
    </tr>
</table>
<p>Usando el align para poner los textos centrados queda:</p>
<table border="1">
    <tr>
        <th align="center">Lunes</th>
        <th align="center">Martes</th>
        <th align="center">Miércoles</th>
        <th align="center">Jueves</th>
        <th align="center">Viernes</th>
    </tr>
    <tr>
        <td align="center">Mates</td>
        <td colspan="3" rowspan="2" align="center"><p>Dibujo</p></td>
        <td rowspan="3" align="center"><p>Historia</p></td>
    </tr>
    <tr>
        <td rowspan="3" align="center"><p>Física</p></td>
    </tr>
    <tr>
        <td align="center">Lengua</td>
        <td align="center">Inglés</td>
        <td align="center">Francés</td>
    </tr>
    <tr>
        <td align="center">EF</td>
        <td align="center">Fútbol</td>
        <td align="center">Tenis</td>
        <td align="center">Mates</td>
    </tr>
</table>
</body>
</html>
