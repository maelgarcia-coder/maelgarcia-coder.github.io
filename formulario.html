<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>
<form action="https://w3schools.com/action_page.php" method="post">
    <fieldset>
        <legend>Información de contacto</legend>
        <label for="name">Nombre:</label>
        <input type="text" id="name" placeholder="Escribe aqui tu nombre"><br>
        <label for="email">Email:</label>
        <input type="email" id="email"><br>
        <label for="message">Mensaje: </label>
        <textarea id="message"></textarea>
        <p>
            <label>Indica la mascota</label>
            <input type="checkbox" name="gato">Gato
            <input type="checkbox" name="perro">Perro
            <input type="checkbox" name="leon">León
        </p>
        <p>
            <label>Sexo</label>
            <input type="radio" name="sexo" value="hombre">Hombre
            <input type="radio" name="sexo" value="mujer">Mujer
            <input type="radio" name="sexo" value="otro">NS/NC
        </p>
        <label for="numero">Edad: </label>
        <input type="number" name="numero" id="numero" min="-10" max="10" step="0.1"><br>
    </fieldset>
    <button type="button" id="boton">Botón</button>
    <button type="submit" id="envio">Enviar</button>
    <button type="reset" id="borrado">Borrar/cancelar</button>
</form>
</body>
</html>
